name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security issues here. Use the private advisory form on the Security tab.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact error text if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as alice
        2. Open the Weekend Trip group
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version reported by the /healthz endpoint on your instance
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Self-hosted (Docker), Self-hosted (bare Node), Local development, Other]
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on Windows 11
