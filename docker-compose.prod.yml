# Production stack: app + Caddy (automatic TLS) + optional Redis.
#   1. cp .env.example .env  and fill in PUBLIC_ORIGIN=https://chat.example.com
#   2. docker compose -f docker-compose.prod.yml up -d --build
services:
  speedy:
    build: .
    image: speedy-chat:1.3.0
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      TRUST_PROXY: '1'
      REDIS_URL: redis://redis:6379
    volumes:
      - speedy-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt: ['no-new-privileges:true']

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - speedy

volumes:
  speedy-data:
  caddy-data:
  caddy-config:
