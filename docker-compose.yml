services:
  speedy:
    build: .
    image: speedy-chat:1.0.0
    container_name: speedy
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      DATA_DIR: /app/data
      TRUST_PROXY: '1'
      # Generate these once and keep them out of version control:
      #   openssl rand -base64 48   -> JWT_SECRET
      #   openssl rand -base64 32   -> MESSAGE_KEY
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MESSAGE_KEY: ${MESSAGE_KEY:?set MESSAGE_KEY in .env}
      LOG_LEVEL: info
    volumes:
      - speedy-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  speedy-data:
